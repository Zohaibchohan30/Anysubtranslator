<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeSub Pro - Custom Model Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f0717; color: #f3e8ff; }
    .card-bg { background-color: #1a0b2e; border-color: #3b0764; }
    .accent-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <header class="border-b border-white/10 p-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold">AnimeSub <span class="text-purple-400">Pro</span></h1>
      <span class="text-xs opacity-60">Manual Model Control Mode</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-4 gap-6 mt-4">
    <aside class="lg:col-span-1 space-y-6">
      <div class="card-bg border rounded-xl p-4 shadow-lg space-y-4">
        <h2 class="text-sm font-semibold text-purple-400">Settings</h2>
        
        <div>
          <label class="text-xs block mb-1 opacity-80">Gemini API Key</label>
          <input type="password" id="apiKey" class="w-full bg-black/20 border border-white/10 rounded px-3 py-2 text-sm" placeholder="Paste your key..." />
        </div>

        <div>
          <label class="text-xs block mb-1 opacity-80">Model ID (Exact Name)</label>
          <input type="text" id="modelInput" value="gemini-1.5-flash" class="w-full bg-black/20 border border-white/10 rounded px-3 py-2 text-sm" placeholder="e.g. gemini-1.5-flash" />
          <p class="text-[10px] opacity-50 mt-1">Type model name exactly as in your console</p>
        </div>

        <div>
          <label class="text-xs block mb-1 opacity-80">Target Language</label>
          <select id="targetLang" class="w-full bg-black/20 border border-white/10 rounded px-3 py-2 text-sm">
            <option value="Hindi (Devenagari script)">Hindi (हिंदी)</option>
            <option value="Urdu">Urdu (اردو)</option>
          </select>
        </div>
      </div>
    </aside>

    <section class="lg:col-span-3 space-y-6">
      <div class="card-bg border border-dashed border-purple-500/40 rounded-xl p-8 text-center relative">
        <input type="file" id="srtInput" accept=".srt,.vtt,.txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleFileUpload(event)" />
        <p class="font-semibold" id="fileNameDisplay">Click or Drop Subtitle File</p>
      </div>

      <textarea id="originalText" readonly class="w-full h-40 bg-black/20 border border-white/10 rounded-lg p-3 text-xs font-mono resize-none"></textarea>
      <textarea id="translatedText" class="w-full h-40 bg-black/20 border border-white/10 rounded-lg p-3 text-xs font-mono resize-none"></textarea>

      <div class="card-bg border rounded-xl p-4 flex items-center justify-between gap-4">
        <div class="w-1/2 h-2 bg-black/40 rounded-full overflow-hidden">
          <div id="progressBar" class="accent-btn h-full w-0 transition-all"></div>
        </div>
        <div class="flex gap-2">
          <button id="translateBtn" onclick="startTranslation()" class="accent-btn px-6 py-2 rounded-lg text-sm font-semibold">Translate</button>
          <button onclick="downloadSRT()" class="bg-gray-700 px-6 py-2 rounded-lg text-sm">Download</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    let loadedSRTContent = "";

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById('fileNameDisplay').innerText = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        let raw = e.target.result.replace(/^WEBVTT.*?\n\n/gi, '').replace(/(\d{2}:\d{2}:\d{2})\.(\d{3})/g, '$1,$2');
        loadedSRTContent = raw;
        document.getElementById('originalText').value = raw;
      };
      reader.readAsText(file);
    }

    async function startTranslation() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('modelInput').value.trim();
      const lang = document.getElementById('targetLang').value;
      
      if (!apiKey || !model) { alert("API Key aur Model Name enter karo!"); return; }

      const chunks = loadedSRTContent.trim().split(/\n\s*\n/).reduce((acc, curr, i) => {
        if (i % 20 === 0) acc.push([]);
        acc[acc.length - 1].push(curr);
        return acc;
      }, []).map(c => c.join("\n\n"));

      const outputBox = document.getElementById('translatedText');
      outputBox.value = "";
      
      for (let i = 0; i < chunks.length; i++) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: `Translate to ${lang}. Keep format perfect.\n${chunks[i]}` }] }] })
          });
          const data = await res.json();
          if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            outputBox.value += (outputBox.value ? "\n\n" : "") + data.candidates[0].content.parts[0].text.replace(/```/g, '');
            document.getElementById('progressBar').style.width = `${((i+1)/chunks.length)*100}%`;
          } else {
            alert(`Error: ${JSON.stringify(data.error?.message || 'Failed')}`); return;
          }
        } catch (e) { alert("Network Error"); return; }
        await new Promise(r => setTimeout(r, 2000));
      }
      alert("Done!");
    }

    function downloadSRT() {
      const blob = new Blob([document.getElementById('translatedText').value], { type: 'text/plain' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'subtitles.srt'; a.click();
    }
  </script>
</body>
</html>
